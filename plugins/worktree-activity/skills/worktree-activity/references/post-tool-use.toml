# Replace both absolute paths before adding these tables to your Codex config.
# Use this explicit configuration when the runtime skips portable plugin hooks.
[[hooks.PostToolUse]]
matcher = '^(mcp__codex_app__)?(create_worktree|get_worktree_creation_status)$'

[[hooks.PostToolUse.hooks]]
type = "command"
command = 'PLUGIN_DATA="/absolute/path/to/worktree-activity-data" python3 "/absolute/path/to/worktree-activity/skills/worktree-activity/scripts/post_tool_use.py"'
timeout = 10
additionalContextLimit = 0
