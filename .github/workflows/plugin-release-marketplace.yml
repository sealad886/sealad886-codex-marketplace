name: Publish marketplace snapshot after plugin release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    if: ${{ !startsWith(github.event.release.tag_name, 'marketplace-v') && !github.event.release.prerelease }}
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ github.sha }}

  publish:
    if: ${{ !startsWith(github.event.release.tag_name, 'marketplace-v') && !github.event.release.prerelease }}
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: marketplace-publication-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    steps:
      - name: Check out plugin release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Check whether this is the newest stable plugin release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          stale="$(
            python3 - <<'PY'
          import json
          import os
          import subprocess

          releases = json.loads(subprocess.run(
              ["gh", "api", "--paginate", "--slurp",
               "repos/" + os.environ["GITHUB_REPOSITORY"] + "/releases?per_page=100"],
              check=True, capture_output=True, text=True,
          ).stdout)
          stable_plugin_releases = [
              release for page in releases for release in page
              if not release["tag_name"].startswith("marketplace-v")
              and not release["prerelease"] and not release["draft"]
          ]
          latest = max(
              stable_plugin_releases,
              key=lambda release: (release["published_at"], release["tag_name"]),
              default=None,
          )
          if latest is None:
              raise SystemExit("No published stable plugin release was found")
          print(str(latest["tag_name"] != os.environ["PLUGIN_RELEASE_TAG"]).lower())
          PY
          )"
          echo "stale=$stale" >> "$GITHUB_OUTPUT"
          if [[ "$stale" == "true" ]]; then
            echo "A newer stable plugin release exists; skipping this outdated marketplace snapshot."
          fi

      - name: Calculate next marketplace version
        if: steps.release.outputs.stale != 'true'
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(
            python3 - <<'PY'
          import re
          import os
          import subprocess

          subprocess.run(["git", "fetch", "origin", "--tags"], check=True)
          tags = subprocess.run(["git", "tag", "--list", "marketplace-v*"],
                                check=True, capture_output=True, text=True).stdout.splitlines()
          pattern = re.compile(r"^marketplace-v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$")
          versions = {tag: tuple(map(int, match.groups())) for tag in tags
                      if (match := pattern.fullmatch(tag))}
          source = subprocess.run(["git", "rev-parse", "HEAD"], check=True,
                                  capture_output=True, text=True).stdout.strip()
          annotation = "Marketplace snapshot after " + os.environ["PLUGIN_RELEASE_TAG"]
          reusable = []
          for tag in versions:
              target = subprocess.run(["git", "rev-parse", tag + "^{}"], check=True,
                                      capture_output=True, text=True).stdout.strip()
              message = subprocess.run(["git", "for-each-ref", "--format=%(contents)",
                                        "refs/tags/" + tag], check=True,
                                       capture_output=True, text=True).stdout.strip()
              if target == source and message == annotation:
                  reusable.append(tag)
          if reusable:
              print(max(reusable, key=versions.get).removeprefix("marketplace-v"))
          elif versions:
              current = max(versions.values())
              print(f"{current[0]}.{current[1]}.{current[2] + 1}")
          else:
              print("0.1.0")
          PY
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=marketplace-v$version" >> "$GITHUB_OUTPUT"

      - name: Create marketplace snapshot tag
        if: steps.release.outputs.stale != 'true'
        env:
          MARKETPLACE_TAG: ${{ steps.version.outputs.tag }}
          PLUGIN_RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          source_sha="$(git rev-parse HEAD)"
          if git show-ref --verify --quiet "refs/tags/$MARKETPLACE_TAG"; then
            test "$(git rev-parse "$MARKETPLACE_TAG^{}")" = "$source_sha"
            test "$(git for-each-ref --format='%(contents)' "refs/tags/$MARKETPLACE_TAG")" = "Marketplace snapshot after $PLUGIN_RELEASE_TAG"
          else
            git tag --annotate "$MARKETPLACE_TAG" \
              --message "Marketplace snapshot after $PLUGIN_RELEASE_TAG" \
              "$source_sha"
          fi
          git push origin "$MARKETPLACE_TAG"

      - name: Publish marketplace snapshot as GitHub Latest
        if: steps.release.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MARKETPLACE_TAG: ${{ steps.version.outputs.tag }}
          PLUGIN_RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          latest="$(
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" | python3 -c '
          import json, os, re, sys
          pattern = re.compile(r"^marketplace-v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$")
          versions = [tuple(map(int, m.groups())) for page in json.load(sys.stdin) for r in page
                      if not r["draft"] and (m := pattern.fullmatch(r["tag_name"]))]
          current = tuple(map(int, pattern.fullmatch(os.environ["MARKETPLACE_TAG"]).groups()))
          print(str(not versions or current >= max(versions)).lower())
          '
          )"
          if gh release view "$MARKETPLACE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Marketplace release already exists; publication is complete."
            exit 0
          fi
          gh release create "$MARKETPLACE_TAG" \
            --verify-tag \
            --title "Marketplace ${MARKETPLACE_TAG#marketplace-v}" \
            --notes "Marketplace snapshot published after plugin release \`$PLUGIN_RELEASE_TAG\`. This release points to the repository files at that plugin release tag; contained plugins retain their independent versions. See the [marketplace changelog](https://github.com/${GITHUB_REPOSITORY}/blob/${MARKETPLACE_TAG}/CHANGELOG.md)." \
            --latest="$latest" \
            --repo "$GITHUB_REPOSITORY"
