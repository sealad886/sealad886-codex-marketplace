name: Validate semantic versioning examples

on:
  push:
    branches: [main]
    paths:
      - 'plugins/semantic-versioning/examples/**'
      - 'plugins/semantic-versioning/templates/workflows/**'
      - 'scripts/check_semver_workflows.py'
      - '.github/workflows/semantic-versioning-examples.yml'
  pull_request:
    branches: [main]
    paths:
      - 'plugins/semantic-versioning/examples/**'
      - 'plugins/semantic-versioning/templates/workflows/**'
      - 'scripts/check_semver_workflows.py'
      - '.github/workflows/semantic-versioning-examples.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        family: [javascript, python, rust, go, jvm, dotnet]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.9'
      - if: matrix.family == 'javascript'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - if: matrix.family == 'go'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.1'
          cache: false
      - if: matrix.family == 'jvm'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21.0.6+7'
      - if: matrix.family == 'dotnet'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.408'
      - name: Install pinned Maven distribution
        if: matrix.family == 'jvm'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/apache-maven-3.9.16-bin.tar.gz"
          curl --fail --location --silent --show-error \
            https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.tar.gz \
            --output "$archive"
          echo "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6  $archive" | sha512sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
      - name: Build and inspect packages in disposable copy
        env:
          FAMILY: ${{ matrix.family }}
        shell: bash
        run: |
          set -euo pipefail
          example_root="$RUNNER_TEMP/semantic-versioning-examples"
          mkdir -p "$example_root"
          cp -R plugins/semantic-versioning/examples/. "$example_root/"
          cd "$example_root/$FAMILY"
          case "$FAMILY" in
            javascript)
              npm test
              npm pack --ignore-scripts --json
              ;;
            python)
              python -m venv "$RUNNER_TEMP/example-build-venv"
              "$RUNNER_TEMP/example-build-venv/bin/python" -m pip install 'build==1.2.2.post1'
              "$RUNNER_TEMP/example-build-venv/bin/python" -m build
              ;;
            rust)
              rustup toolchain install 1.85.0 --profile minimal
              cargo +1.85.0 test --workspace
              cargo +1.85.0 package -p semver-example-core --allow-dirty
              ;;
            go)
              go test ./...
              go build -trimpath -ldflags '-X main.version=0.1.0' -o semver-example .
              test "$(./semver-example)" = '0.1.0'
              ;;
            jvm)
              mvn -B package
              ;;
            dotnet)
              dotnet pack --configuration Release
              ;;
          esac
          if [[ "$FAMILY" != go ]]; then
            python "$example_root/check_artifact.py" "$FAMILY" "$example_root/$FAMILY"
          fi

  workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.3'
          cache: false
      - name: Validate materialized release workflow interfaces
        shell: bash
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/actionlint-bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          python3 scripts/check_semver_workflows.py --actionlint "$RUNNER_TEMP/actionlint-bin/actionlint"
