name: Validate plugin

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to validate instead of the triggering ref
        required: false
        type: string
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}

      - name: Validate repository marketplace and license parity
        run: python3 scripts/check_marketplace.py .

      - name: Validate manifests with OpenAI Plugin Creator
        env:
          PLUGIN_VALIDATOR_SHA256: ebda00d55d7518b127f675f062fb5c6e7a1ffdc0a99df1a55ac594400d7d3228
          PLUGIN_VALIDATOR_URL: https://raw.githubusercontent.com/openai/codex/2c351cb8646054427e0ea81a484233114b1234f7/codex-rs/skills/src/assets/samples/plugin-creator/scripts/validate_plugin.py
        run: |
          validator_root="$RUNNER_TEMP/plugin-creator-validator"
          validator_script="$validator_root/validate_plugin.py"
          python3 -m venv "$validator_root/venv"
          "$validator_root/venv/bin/python" -m pip install \
            --disable-pip-version-check 'PyYAML==6.0.3'
          curl --fail --location --silent --show-error \
            "$PLUGIN_VALIDATOR_URL" --output "$validator_script"
          echo "$PLUGIN_VALIDATOR_SHA256  $validator_script" | shasum -a 256 -c -
          mkdir "$validator_root/pinned"
          while IFS=$'\t' read -r source_type source_ref plugin_dir; do
            if [[ "$source_type" == "git-subdir" ]]; then
              git archive "$source_ref" -- "$plugin_dir" | \
                tar -x -C "$validator_root/pinned"
              plugin_dir="$validator_root/pinned/$plugin_dir"
            fi
            "$validator_root/venv/bin/python" "$validator_script" "$plugin_dir"
          done < <(
            python3 -c 'import json; data = json.load(open(".agents/plugins/marketplace.json")); [print(source["source"], source.get("ref", "-"), source["path"].removeprefix("./"), sep="\t") for source in (entry["source"] for entry in data["plugins"])]'
          )

      - name: Validate catalog package structure and distribution payloads
        run: |
          python3 - <<'PY'
          import json
          import subprocess

          with open(".agents/plugins/marketplace.json", encoding="utf-8") as stream:
              entries = json.load(stream)["plugins"]
          for entry in entries:
              package = entry["source"]["path"]
              subprocess.run(["python3", "scripts/check_plugin.py", package, "--layout", "source"], check=True)
              subprocess.run(["python3", "scripts/check_distribution_bundle.py", package], check=True)
          PY

      - name: Validate Semantic Versioning examples
        run: python3 scripts/check_semantic_versioning.py

      - name: Validate route contracts
        run: python3 scripts/check_routes.py .

      - name: Validate historical route-shape compatibility
        run: python3 scripts/check_route_receipts.py tests/fixtures/blind-route-observations-v1.3.1.json --root . --allow-subset --allow-historical-annotations

      - name: Validate Conversation Visuals MCP
        run: python3 plugins/conversation-visuals/mcp/server.py --self-test

      - name: Validate iCloud Mail MCP
        run: python3 plugins/icloud-mail/mcp/server.py --self-test

      - name: Run validator regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
