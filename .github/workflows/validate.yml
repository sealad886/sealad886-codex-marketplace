name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Validate manifests with OpenAI Plugin Creator
        env:
          PLUGIN_VALIDATOR_SHA256: ebda00d55d7518b127f675f062fb5c6e7a1ffdc0a99df1a55ac594400d7d3228
          PLUGIN_VALIDATOR_URL: https://raw.githubusercontent.com/openai/codex/2c351cb8646054427e0ea81a484233114b1234f7/codex-rs/skills/src/assets/samples/plugin-creator/scripts/validate_plugin.py
        run: |
          validator_root="$RUNNER_TEMP/plugin-creator-validator"
          validator_script="$validator_root/validate_plugin.py"
          python3 -m venv "$validator_root/venv"
          "$validator_root/venv/bin/python" -m pip install \
            --disable-pip-version-check 'PyYAML==6.0.3'
          curl --fail --location --silent --show-error \
            "$PLUGIN_VALIDATOR_URL" --output "$validator_script"
          echo "$PLUGIN_VALIDATOR_SHA256  $validator_script" | shasum -a 256 -c -
          "$validator_root/venv/bin/python" "$validator_script" \
            plugins/project-delivery
          "$validator_root/venv/bin/python" "$validator_script" \
            plugins/conversation-visuals

      - name: Validate Project Delivery structure
        run: python3 scripts/check_plugin.py plugins/project-delivery --layout source

      - name: Validate Conversation Visuals structure
        run: python3 scripts/check_plugin.py plugins/conversation-visuals --layout source

      - name: Validate route contracts
        run: python3 scripts/check_routes.py .

      - name: Validate historical route-shape compatibility
        run: python3 scripts/check_route_receipts.py tests/fixtures/blind-route-observations-v1.3.1.json --root . --allow-subset --allow-historical-annotations

      - name: Validate exact distribution payload
        run: python3 scripts/check_distribution_bundle.py plugins/project-delivery

      - name: Validate Conversation Visuals distribution payload
        run: python3 scripts/check_distribution_bundle.py plugins/conversation-visuals

      - name: Validate Conversation Visuals MCP
        run: python3 plugins/conversation-visuals/mcp/server.py --self-test

      - name: Validate repository marketplace and license parity
        run: python3 scripts/check_marketplace.py .

      - name: Run validator regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
