name: HOL Plugin Scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Scan Project Delivery plugin
        uses: hashgraph-online/ai-plugin-scanner-action@v1
        with:
          plugin_dir: "plugins/project-delivery"
          mode: scan
          min_score: 80
          fail_on_severity: high
          format: sarif
          profile: public-marketplace
          upload_sarif: true
          sarif_category: project-delivery
          cisco_skill_scan: true
          install_cisco: true

  scan-conversation-visuals:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Scan Conversation Visuals plugin
        uses: hashgraph-online/ai-plugin-scanner-action@v1
        with:
          plugin_dir: ""
          mode: scan
          min_score: 80
          fail_on_severity: high
          format: sarif
          profile: public-marketplace
          upload_sarif: true
          sarif_category: conversation-visuals
          cisco_skill_scan: true
          install_cisco: true

  scan-icloud-mail:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Scan iCloud Mail plugin
        uses: hashgraph-online/ai-plugin-scanner-action@v1
        with:
          plugin_dir: "plugins/icloud-mail"
          mode: scan
          min_score: 80
          fail_on_severity: high
          format: sarif
          profle: public-marketplace
          upload_sarif: true
          sarif_category: icloud-mail
          cisco_skill_scan: true
          install_cisco: true
