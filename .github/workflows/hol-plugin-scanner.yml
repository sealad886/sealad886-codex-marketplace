name: HOL Plugin Scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Scan Project Delivery plugin
        uses: hashgraph-online/ai-plugin-scanner-action@8f0a503ca2a70c1968a9a883e11fdff5737b7909 # v1.2.514
        with:
          plugin_dir: "plugins/project-delivery"
          mode: scan
          min_score: 80
          fail_on_severity: high
          format: sarif
          profile: public-marketplace
          upload_sarif: true
          sarif_category: project-delivery
          cisco_skill_scan: "on"
          install_cisco: true

  scan-conversation-visuals:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Scan Conversation Visuals plugin
        uses: hashgraph-online/ai-plugin-scanner-action@8f0a503ca2a70c1968a9a883e11fdff5737b7909 # v1.2.514
        with:
          plugin_dir: "plugins/conversation-visuals"
          mode: scan
          min_score: 80
          fail_on_severity: high
          format: sarif
          profile: public-marketplace
          upload_sarif: true
          sarif_category: conversation-visuals
          cisco_skill_scan: "on"
          install_cisco: true

  scan-icloud-mail:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Scan iCloud Mail plugin
        uses: hashgraph-online/ai-plugin-scanner-action@8f0a503ca2a70c1968a9a883e11fdff5737b7909 # v1.2.514
        with:
          plugin_dir: "plugins/icloud-mail"
          mode: scan
          min_score: 80
          fail_on_severity: high
          format: sarif
          profile: public-marketplace
          upload_sarif: true
          sarif_category: icloud-mail
          cisco_skill_scan: "on"
          install_cisco: true
