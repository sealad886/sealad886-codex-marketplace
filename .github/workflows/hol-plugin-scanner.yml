name: HOL Plugin Scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Scan plugin
        uses: hashgraph-online/ai-plugin-scanner-action@b11c05ef7ee17c7d84299de8a245e364c1cb070c # v1.2.533
        with:
          plugin_dir: "plugins/project-delivery"
          mode: scan
          min_score: 80
          fail_on_severity: high
          format: sarif
          upload_sarif: true
          sarif_category: project-delivery

  scan-conversation-visuals:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Scan Conversation Visuals
        uses: hashgraph-online/ai-plugin-scanner-action@b11c05ef7ee17c7d84299de8a245e364c1cb070c # v1.2.533
        with:
          plugin_dir: "plugins/conversation-visuals"
          mode: scan
          min_score: 80
          fail_on_severity: high
          format: sarif
          upload_sarif: true
          sarif_category: conversation-visuals

  scan-mlx-optimizer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Scan MLX Optimizer
        uses: hashgraph-online/ai-plugin-scanner-action@b11c05ef7ee17c7d84299de8a245e364c1cb070c # v1.2.533
        with:
          plugin_dir: "plugins/mlx-optimizer"
          mode: scan
          min_score: 80
          fail_on_severity: high
          format: sarif
          upload_sarif: true
          sarif_category: mlx-optimizer
